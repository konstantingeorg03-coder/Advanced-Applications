<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Warehouse</title>
    <style>
        .products {background: orange;}
        .top {background: lightgreen;}
        .card { background: lightyellow; }
    </style>
</head>
<body>
    <h1>My WareHouse</h1>
    <p class="products">Shoes</p>
    <div class="products">
    <h2>Products</h2>
    <img src="https://picsum.photos/200" alt="Warehouse photo">
    <ul>
        <li>T-shirts</li>
        <li>Jackets</li>
        <li>Sweaters</li>
    </ul>
    </div>
    <article class="card">
        <div class="title">
            <h2>Nike Air Max</h2>
        </div>
            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPL14EZh84sNEnM2q6IKTyR6hCtTs927F64FZmzsDi-w&s=1" alt="Nike Air Max">
            </div>
                <p>Price: 120 euro</p>
                <a href="https://www.nike.com">Buy</a>
    </article>
    <div class="top">
    <h2>Top 3</h2>
    <ol>
        <li><a href="https://www.nike.com">Nike Path</a></li>
        <li><a href="https://www.adidas.com">Adidas</a></li>
        <li><a href="https://www.puma.com">Puma</a></li>
    </ol>
    </div>
    <div style="background: lightblue;">Аз съм div 1</div>
    <div style="background: pink;">Аз съм div 2</div>

    <span style="background: yellow;">Аз съм span 1</span>
    <span style="background: lightgreen;">Аз съм span 2</span>
</body>
</html>
