<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Authorization Exercise</title>
    </head>
    <body>
        <h2>Register</h2>
        <form id="registerForm">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password">
            <button>Register</button>
        </form>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password">
            <button>Login</button>
        </form> 
        <p id="info"></p>
        <button id="logoutBtn">Logout</button>
        <script src="12. auth.js"></script>
    </body>
</html>
